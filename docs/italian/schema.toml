  { name = "lexeme_id", type = "str", provenance = "derived", licence = "by-sa", doc = "the lexeme" },
  { name = "word", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "headword" },
  { name = "pos", type = "enum", allowed = ["noun", "adj"], provenance = "wiktionary_en", licence = "by-sa", doc = "part of speech" },
  { name = "gender", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "gender" },
  { name = "cell", type = "enum", allowed = ["pl", "m.pl", "f.pl"], provenance = "derived", licence = "by-sa", doc = "plural cell" },
  { name = "plural_qc", type = "enum", allowed = ["confirmed", "variant", "module_default_only", "conflict"], provenance = "derived", licence = "by-sa", doc = "QC verdict" },
  { name = "variant_kind", type = "enum", allowed = ["velar_palatal", "labelled", "other", ""], provenance = "derived", licence = "by-sa", doc = "kind of a variant" },
  { name = "wiktionary_forms", type = "list", provenance = "wiktionary_en", licence = "by-sa", doc = "en.wiktionary forms" },
  { name = "provenance", type = "list", provenance = "derived", licence = "by-sa", doc = "explicit/module_default of each form" },
