  { name = "attested_ge2pm", type = "bool", provenance = "leipzig", licence = "unverified", doc = "folded count ≥ 2 per million and count_cs ≥ 1" },
  { name = "attested_cs_ge1", type = "bool", provenance = "leipzig", licence = "unverified", doc = "case-sensitive count ≥ 1" },
  { name = "attested_cs_ge0.5pm", type = "bool", provenance = "leipzig", licence = "unverified", doc = "case-sensitive ≥ 0.5 per million" },
