  { name = "demauro_url", type = "str", provenance = "derived", licence = "by-sa", doc = "De Mauro lookup URL (by hand only)" },
  { name = "source", type = "list", allowed = ["wiktionary_en", "wiktionary_it", "morphit"], provenance = "derived", licence = "by-sa", doc = "sources (R9)" },
]

[files.attestation]
path = "data/italian/italian_attestation.csv"
stage = "attest"
tracked = false
fields = "lexpipe.langs.italian.attestation:ATTESTATION_FIELDS"
description = "Leipzig attestation of every lemma, feminine singular and plural form (R11), sorted by lexeme_id, cell, form."
columns = [
  { name = "lexeme_id", type = "str", provenance = "derived", licence = "by-sa", doc = "the lexeme" },
