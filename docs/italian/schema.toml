# Schema of every CSV the Italian pipeline writes (design §8).
#
# Source of truth for docs/italian/data_dict.md (generated by the
# ``docs`` stage, lexpipe.langs.italian.schema) and for
# tests/italian/test_schema.py, which checks that each writer's header
# (the code constant named by ``fields``) equals the columns listed here,
# in order, and that files on disk have that header.
#
# Per file: path (relative to the repository root), stage, tracked
# (in git: aggregates and Wiktionary-derived data only, R9), fields
# ("module:CONSTANT"), description.
# Per column:
#   type        str | int | float | bool (True/False, R10) | list ("|"-joined,
#               source order unless the doc says sorted) | enum
#   allowed     the values of an enum (or of a controlled list)
#   provenance  wiktionary_en | wiktionary_it | morphit | leipzig (corpus
#               counts) | module (Module:it-common port) | curated |
#               derived (computed by the pipeline from the other columns)
#   licence     by-sa (Wiktionary / Morph-it! derived) | unverified
#               (Leipzig counts: never tracked) | citation (hand
#               adjudication: coded value + citation)
#   doc         one line

version = 1

[files.lexicon_raw]
path = "data/italian/italian_lexicon_raw.csv"
stage = "lexicon"
tracked = true
fields = "lexpipe.langs.italian.lexicon:RAW_FIELDS"
description = "The tracked raw lexicon: one row per noun/adjective lexeme of the en.wiktionary Italian split, with the extracted columns only (nothing derived), sorted by lexeme_id; out-of-domain proper names (domain capitalized) and multiword expressions are left out (they are in italian_lexicon_full.csv)."
columns = [
  { name = "lexeme_id", type = "str", provenance = "derived", licence = "by-sa", doc = "{lang}:{word}:{pos}:{ety}:{fp} (R4; lexpipe.ids)" },
  { name = "word", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "headword as written (NFC)" },
  { name = "pos", type = "enum", allowed = ["noun", "adj"], provenance = "wiktionary_en", licence = "by-sa", doc = "part of speech of the entry" },
  { name = "gender", type = "enum", allowed = ["m", "f", "mf", "mfbysense", "n", "?", ""], provenance = "wiktionary_en", licence = "by-sa", doc = "base of the first gender code of the head" },
  { name = "head_args", type = "list", provenance = "wiktionary_en", licence = "by-sa", doc = "the head templates as written, one item each: key=value pairs joined by ';' (backslash-escaped), prefixed with 'name:' unless the template is it-noun (nouns) or it-adj (adjectives); lexpipe.kaikki.head_args" },
  { name = "ipa_raw", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "primary transcription as written (delimiters, stress, syllable dots)" },
  { name = "etymology_summary", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "the deciding etymology template, summarized: kind:lang:term for a source (inh:la:amīcus), the kind alone for an internal formation (af); lexpipe.etymology.summary" },
  { name = "first_gloss", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "first gloss of the first sense" },
  { name = "source", type = "str", allowed = ["wiktionary_en"], provenance = "derived", licence = "by-sa", doc = "source of the row (R9)" },
]

[files.lexicon_full]
path = "data/italian/italian_lexicon_full.csv"
stage = "lexicon"
tracked = false
fields = "lexpipe.langs.italian.lexicon:LEXICON_FIELDS"
description = "Every noun/adjective lexeme of the en.wiktionary Italian split with every column of the lexicon stage (gitignored; read by the later stages), sorted by lexeme_id."
columns = [
  { name = "lexeme_id", type = "str", provenance = "derived", licence = "by-sa", doc = "{lang}:{word}:{pos}:{ety}:{fp} (R4; lexpipe.ids)" },
  { name = "root_id", type = "str", provenance = "derived", licence = "by-sa", doc = "root of the lexeme: stem + etymon key + stress (R4); merges POS conversions and gender pairs" },
  { name = "word", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "headword as written (NFC)" },
  { name = "pos", type = "enum", allowed = ["noun", "adj"], provenance = "wiktionary_en", licence = "by-sa", doc = "part of speech of the entry" },
  { name = "etymology_number", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "etymology label of the page (0 when absent; 1.2 for sub-etymologies)" },
  { name = "head_template", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "name of the head template (it-noun, it-adj, …)" },
  { name = "domain", type = "enum", allowed = ["in_domain", "multiword", "hyphenated", "affix", "capitalized", "nonalphabetic", "abbreviation", "clipping", "plurale_tantum", "plural_form"], provenance = "derived", licence = "by-sa", doc = "in_domain or the first out-of-domain class (plurale_tantum: every gender code plural-only; plural_form: the first sense, or every sense, is 'plural of X': alimenti, crostini)" },
  { name = "domain_flags", type = "list", provenance = "derived", licence = "by-sa", doc = "every out-of-domain class that applies, in the order of `domain`'s values" },
  { name = "gender_raw", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "head argument 1 as written" },
  { name = "gender", type = "enum", allowed = ["m", "f", "mf", "mfbysense", "n", "?", ""], provenance = "derived", licence = "by-sa", doc = "base of the first gender code" },
  { name = "genders", type = "list", provenance = "derived", licence = "by-sa", doc = "every gender code, in order (f|m for eco)" },
  { name = "gender_labels", type = "list", provenance = "wiktionary_en", licence = "by-sa", doc = "inline labels of the gender codes" },
  { name = "by_sense", type = "bool", provenance = "derived", licence = "by-sa", doc = "gender by sense (mfbysense)" },
  { name = "plurale_tantum", type = "bool", provenance = "derived", licence = "by-sa", doc = "a -p gender code" },
  { name = "plural_status", type = "enum", allowed = ["regular", "uncountable", "plurale_tantum", "unknown", "noforms", "no_head_template", "none"], provenance = "derived", licence = "by-sa", doc = "plural class of the lexeme (lexpipe.langs.italian.plurals); an invariable noun is regular (its plural is the lemma) with invariable = True" },
  { name = "plural_provenance", type = "enum", allowed = ["explicit", "module_default", "mixed", "none"], provenance = "derived", licence = "by-sa", doc = "whether the plurals are typed by an editor or generated by Module:it-common (R12)" },
  { name = "countability", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "uncountable | countable_and_uncountable | plural_unknown | plural_unattested (head codes - ~ ? !)" },
  { name = "invariable", type = "bool", provenance = "derived", licence = "by-sa", doc = "plural = lemma (# code)" },
  { name = "pure_default", type = "bool", provenance = "derived", licence = "by-sa", doc = "no plural argument at all (the drift test's population)" },
  { name = "plural_drift", type = "enum", allowed = ["match", "mismatch", "port_error", "not_ported", ""], provenance = "module", licence = "by-sa", doc = "drift-test status of the lexeme (R12)" },
  { name = "pl_forms", type = "list", provenance = "wiktionary_en", licence = "by-sa", doc = "plural forms (nouns), source order" },
  { name = "mpl_forms", type = "list", provenance = "wiktionary_en", licence = "by-sa", doc = "masculine plural forms (adjectives, mf nouns)" },
  { name = "fpl_forms", type = "list", provenance = "wiktionary_en", licence = "by-sa", doc = "feminine plural forms" },
  { name = "plural_labels", type = "list", provenance = "wiktionary_en", licence = "by-sa", doc = "form:label/label of labelled variants (archaic, literary, …)" },
  { name = "feminine_forms", type = "list", provenance = "wiktionary_en", licence = "by-sa", doc = "feminine counterparts stated by the head" },
  { name = "masculine_forms", type = "list", provenance = "wiktionary_en", licence = "by-sa", doc = "masculine counterparts stated by the head" },
  { name = "ipa_raw", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "primary transcription as written (delimiters, stress, syllable dots)" },
  { name = "ipa", type = "str", provenance = "derived", licence = "by-sa", doc = "normalized transcription body (R8; ties added, ':' → ː)" },
  { name = "ipa_kind", type = "enum", allowed = ["phonemic", "phonetic", ""], provenance = "derived", licence = "by-sa", doc = "/…/ or […]" },
  { name = "ipa_count", type = "int", provenance = "wiktionary_en", licence = "by-sa", doc = "number of IPA transcriptions of the entry" },
  { name = "stress_from_end", type = "int", provenance = "derived", licence = "by-sa", doc = "1 final, 2 penultimate, 3 antepenultimate, 4 earlier; empty when unknown" },
  { name = "stress_class", type = "enum", allowed = ["oxytone", "paroxytone", "proparoxytone", "preproparoxytone", ""], provenance = "derived", licence = "by-sa", doc = "name of stress_from_end" },
  { name = "stress_source", type = "enum", allowed = ["ipa", "hyphenation", "it_hyphenation", ""], provenance = "derived", licence = "by-sa", doc = "where the stress comes from (empty: missing)" },
  { name = "stress_variants", type = "list", provenance = "derived", licence = "by-sa", doc = "distinct stress positions over all IPAs" },
  { name = "stress_missing", type = "bool", provenance = "derived", licence = "by-sa", doc = "no stress from any source" },
  { name = "final_post_tonic", type = "bool", provenance = "derived", licence = "by-sa", doc = "the final syllable (holding a stem-final -co/-go velar) follows the stressed one" },
  { name = "ico_stressed", type = "bool", provenance = "derived", licence = "by-sa", doc = "for a lemma in -ico/-ica: the i of the ending carries the stress (amìco); False for another stressed vowel (arcaico /arˈkaj.ko/: the i is a glide) or position; empty for other lemmas or unknown stress" },
  { name = "hyphenation", type = "list", provenance = "wiktionary_en", licence = "by-sa", doc = "en accented hyphenation" },
  { name = "etymon_lang", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "language code of the first source step" },
  { name = "etymon", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "term of the first source step" },
  { name = "first_transmission", type = "str", provenance = "derived", licence = "by-sa", doc = "template kind deciding the stratum (inh, bor, lbor, af, surf, …)" },
  { name = "it_entries", type = "int", provenance = "wiktionary_it", licence = "by-sa", doc = "matching it.wiktionary entries (same word and POS)" },
  { name = "it_gender", type = "str", provenance = "wiktionary_it", licence = "by-sa", doc = "gender in it.wiktionary" },
  { name = "it_forms", type = "list", provenance = "wiktionary_it", licence = "by-sa", doc = "cell:form of the it.wiktionary entry" },
  { name = "it_invariable", type = "bool", provenance = "wiktionary_it", licence = "by-sa", doc = "invariable in it.wiktionary" },
  { name = "it_hyphenation", type = "list", provenance = "wiktionary_it", licence = "by-sa", doc = "it.wiktionary accented hyphenation" },
  { name = "it_stress_from_end", type = "int", provenance = "derived", licence = "by-sa", doc = "stress from the it.wiktionary hyphenation" },
  { name = "stress_agrees", type = "bool", provenance = "derived", licence = "by-sa", doc = "en and it stress agree (empty when either is missing)" },
  { name = "stress_rejected", type = "list", provenance = "derived", licence = "by-sa", doc = "hyphenation stresses not used, source:reason (other_word: the hyphenation spells another word; ico_accent_vs_template: it accents the i of -ico although the word is X + -ico)" },
  { name = "first_gloss", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "first gloss of the first sense" },
  { name = "source", type = "list", allowed = ["wiktionary_en", "wiktionary_it"], provenance = "derived", licence = "by-sa", doc = "sources of the row (R9)" },
]

[files.plural_forms]
path = "data/italian/italian_plural_forms.csv"
stage = "lexicon"
tracked = false
fields = "lexpipe.langs.italian.lexicon:PLURAL_FIELDS"
description = "One row per plural form built from the head-template arguments (R12), sorted by lexeme_id, cell, item."
columns = [
  { name = "lexeme_id", type = "str", provenance = "derived", licence = "by-sa", doc = "the lexeme" },
  { name = "cell", type = "enum", allowed = ["pl", "m.pl", "f.pl"], provenance = "derived", licence = "by-sa", doc = "plural cell" },
  { name = "form", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "the plural form (empty for a row without a form)" },
  { name = "provenance", type = "enum", allowed = ["explicit", "module_default"], provenance = "derived", licence = "by-sa", doc = "typed by an editor or generated by Module:it-common" },
  { name = "code", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "head code (+ # ? ! - ~) or default" },
  { name = "gender", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "gender the form was generated for" },
  { name = "qualifiers", type = "list", provenance = "wiktionary_en", licence = "by-sa", doc = "inline <q:>/<qq:> qualifiers" },
  { name = "labels", type = "list", provenance = "wiktionary_en", licence = "by-sa", doc = "inline <l:>/<ll:> labels" },
  { name = "raw_arg", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "the head argument as written" },
  { name = "tag_error", type = "str", provenance = "derived", licence = "by-sa", doc = "default_error | not_ported | no_default | unbalanced" },
  { name = "item", type = "int", provenance = "derived", licence = "by-sa", doc = "position within the cell" },
  { name = "source", type = "str", allowed = ["wiktionary_en"], provenance = "derived", licence = "by-sa", doc = "source (R9)" },
]

[files.plural_drift]
path = "data/italian/italian_plural_drift.csv"
stage = "lexicon"
tracked = false
fields = "lexpipe.langs.italian.lexicon:DRIFT_FIELDS"
description = "The Module:it-common drift test (R12): resolved plurals against the plurals kaikki rendered."
columns = [
  { name = "lexeme_id", type = "str", provenance = "derived", licence = "by-sa", doc = "the lexeme" },
  { name = "word", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "headword" },
  { name = "pos", type = "enum", allowed = ["noun", "adj"], provenance = "wiktionary_en", licence = "by-sa", doc = "part of speech" },
  { name = "gender", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "gender used by the port" },
  { name = "scope", type = "enum", allowed = ["pure_default_noun", "pure_default_adj", "with_arguments"], provenance = "derived", licence = "by-sa", doc = "which test the row belongs to" },
  { name = "status", type = "enum", allowed = ["match", "mismatch", "port_error", "not_ported"], provenance = "module", licence = "by-sa", doc = "drift status" },
  { name = "resolved", type = "list", provenance = "module", licence = "by-sa", doc = "plurals of the port" },
  { name = "rendered", type = "list", provenance = "wiktionary_en", licence = "by-sa", doc = "plurals kaikki rendered" },
  { name = "module_revision", type = "str", provenance = "module", licence = "by-sa", doc = "Module:it-common revision of the port" },
]

[files.qc]
path = "data/italian/italian_qc.csv"
stage = "qc"
tracked = false
fields = "lexpipe.langs.italian.qc:QC_FIELDS"
description = "Plural QC per lexeme × cell against Morph-it! and it.wiktionary (tier 1, R12)."
columns = [
  { name = "lexeme_id", type = "str", provenance = "derived", licence = "by-sa", doc = "the lexeme" },
  { name = "word", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "headword" },
  { name = "pos", type = "enum", allowed = ["noun", "adj"], provenance = "wiktionary_en", licence = "by-sa", doc = "part of speech" },
  { name = "gender", type = "str", provenance = "wiktionary_en", licence = "by-sa", doc = "gender" },
  { name = "cell", type = "enum", allowed = ["pl", "m.pl", "f.pl"], provenance = "derived", licence = "by-sa", doc = "plural cell" },
  { name = "wiktionary_forms", type = "list", provenance = "wiktionary_en", licence = "by-sa", doc = "en.wiktionary forms of the cell" },
  { name = "provenance", type = "list", provenance = "derived", licence = "by-sa", doc = "explicit/module_default of each form" },
  { name = "labelled_forms", type = "list", provenance = "wiktionary_en", licence = "by-sa", doc = "forms carrying usage labels" },
  { name = "morphit_forms", type = "list", provenance = "morphit", licence = "by-sa", doc = "Morph-it! noun forms of the cell" },
  { name = "morphit_adj_forms", type = "list", provenance = "morphit", licence = "by-sa", doc = "Morph-it! adjective forms (generated; never confirm, R11)" },
  { name = "it_forms", type = "list", provenance = "wiktionary_it", licence = "by-sa", doc = "it.wiktionary forms of the cell" },
  { name = "plural_qc", type = "enum", allowed = ["confirmed", "variant", "module_default_only", "conflict"], provenance = "derived", licence = "by-sa", doc = "QC verdict (R12)" },
  { name = "qc_basis", type = "enum", allowed = ["morphit", "wiktionary_it", "morphit+wiktionary_it", "explicit_only", "module_default", ""], provenance = "derived", licence = "by-sa", doc = "what confirmed the cell" },
  { name = "variant_kind", type = "enum", allowed = ["velar_palatal", "labelled", "other", ""], provenance = "derived", licence = "by-sa", doc = "kind of a variant cell" },
  { name = "gender_qc", type = "enum", allowed = ["agree", "conflict", "no_evidence", ""], provenance = "derived", licence = "by-sa", doc = "noun gender against Morph-it! and it.wiktionary" },
  { name = "morphit_genders", type = "list", provenance = "morphit", licence = "by-sa", doc = "genders in Morph-it!" },
  { name = "it_gender", type = "str", provenance = "wiktionary_it", licence = "by-sa", doc = "gender in it.wiktionary" },
  { name = "dorsal", type = "bool", provenance = "derived", licence = "by-sa", doc = "-co/-go/-ca/-ga stem" },
  { name = "suspect", type = "enum", allowed = ["e_palatal", ""], provenance = "derived", licence = "by-sa", doc = "a dorsal plural palatalizing before -e (editing error)" },
  { name = "suspect_forms", type = "list", provenance = "wiktionary_en", licence = "by-sa", doc = "the suspect forms" },
  { name = "source", type = "list", allowed = ["wiktionary_en", "wiktionary_it", "morphit"], provenance = "derived", licence = "by-sa", doc = "sources of the row (R9)" },
]

[files.manual_worklist]
path = "analysis/italian/italian_manual_worklist.csv"
stage = "qc"
tracked = true
fields = "lexpipe.langs.italian.qc:WORKLIST_FIELDS"
